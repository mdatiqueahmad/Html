<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse; /* try without collapse */
            text-align: center;
            color:#802d2d;

        }
        td,th{
            border: 1px solid black;
            padding: 10px;
        }
        tr  :nth-child(even) {
            background-color: #040404 ;
        }
    </style>
</head>
<body>
   <!-- table>tr>th*3 -->
    <table>
        <colgroup>
            <col span="2" style="background-color: cyan;">
        </colgroup>

        <tr>
            <th>Country </th>
            <th>country Code</th>
            <th>email</th>
        </tr>
        <!-- tr>td*3 -->
          <tr>
            <td>India</td>
            <td>IN</td>
            <td>india@google.com</td>
          </tr>
            <tr>
            <td>united states of america</td>
            <td>usa</td>
            <td>usa@google.com</td>
          </tr> 
           <tr>
            <td>china</td>
            <td>cn</td>
            <td>cn@google.com</td>
          </tr>
           <tr>
            <td>japan</td>
            <td>jn</td>
            <td>jn@google.com</td>
          </tr>
          </table>
          <hr>
          <table>
          <tr>
            <th colspan="2">Country </th>
            <td>country Code</th>
            <td>email</th>
        </tr>
        <tr>
            <th>Code </th>
            <td>in</td>
            <td>jp</th>
        </tr>
    </table>
</body>
</html>
